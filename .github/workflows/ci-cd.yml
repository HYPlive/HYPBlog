name: Build and deploy HYPBlog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: hypblog
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Initialize test database
        run: mysql -h 127.0.0.1 -uroot -ptest-password hypblog < blog-api/nblog.sql
      - name: Test API
        working-directory: blog-api
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B test
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build frontends
        run: |
          npm install --no-audit --no-fund
          npm run build
        working-directory: blog-view
      - name: Build CMS
        run: |
          npm install --no-audit --no-fund
          npm run build
        working-directory: blog-cms

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./blog-api
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/hypblog-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./blog-view
          push: true
          build-args: VUE_APP_API_BASE_URL=https://api.hyptest.cn/blog
          tags: ${{ env.IMAGE_PREFIX }}/hypblog-view:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./blog-cms
          push: true
          build-args: |
            VUE_APP_API_BASE_URL=https://api.hyptest.cn/blog/admin
            VUE_APP_PUBLIC_PATH=/
          tags: ${{ env.IMAGE_PREFIX }}/hypblog-cms:${{ github.sha }}
      - name: Prepare deployment directories
        if: vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            install -d -m 755 /home/ubuntu/hypblog-deploy/compose /home/ubuntu/hypblog-deploy/data/upload /home/ubuntu/hypblog-deploy/log
            install -d -m 750 /home/ubuntu/hypblog-deploy/config
      - name: Sync Compose definition
        if: vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/compose/docker-compose.yml
          target: /home/ubuntu/hypblog-deploy/compose/
          strip_components: 2
      - name: Deploy on server
        if: vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            test -f /home/ubuntu/hypblog-deploy/.env
            test -f /home/ubuntu/hypblog-deploy/config/api.env
            test -f /home/ubuntu/hypblog-deploy/config/application-prod.properties
            cd /home/ubuntu/hypblog-deploy/compose
            export GHCR_OWNER='${{ github.repository_owner }}'
            export IMAGE_TAG='${{ github.sha }}'
            echo '${{ secrets.GHCR_READ_TOKEN }}' | docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin
            docker compose --env-file /home/ubuntu/hypblog-deploy/.env config --quiet
            docker compose --env-file /home/ubuntu/hypblog-deploy/.env pull
            docker compose --env-file /home/ubuntu/hypblog-deploy/.env up -d --remove-orphans
            if ! curl --fail --retry 10 --retry-connrefused http://127.0.0.1:18080/ || ! curl --fail --retry 10 --retry-connrefused http://127.0.0.1:18079/ || ! curl --fail --retry 10 --retry-connrefused http://127.0.0.1:18090/site; then
              docker compose --env-file /home/ubuntu/hypblog-deploy/.env ps
              docker compose --env-file /home/ubuntu/hypblog-deploy/.env logs --tail=100 api view cms
              exit 1
            fi
            docker image prune -f
