services:
  api:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/hypblog-api:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${API_ENV_PATH:?set API_ENV_PATH}
    volumes:
      - ${UPLOAD_PATH:?set UPLOAD_PATH}:/opt/hypblog/upload
      - ${LOG_PATH:?set LOG_PATH}:/opt/hypblog/log
      - ${API_CONFIG_PATH:?set API_CONFIG_PATH}:/config/application-prod.properties:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/config/application-prod.properties
      JAVA_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 700m

  view:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/hypblog-view:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    mem_limit: 128m

  cms:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/hypblog-cms:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18079:80"
    mem_limit: 128m
