services:
  api:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/hypblog-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./api.env
    volumes:
      - ${UPLOAD_PATH:-/home/ubuntu/hypblog/upload}:/opt/hypblog/upload
      - ${LOG_PATH:-/home/ubuntu/hypblog/log}:/opt/hypblog/log
      - ${API_CONFIG_PATH:-/home/ubuntu/hypblog/config/application-prod.properties}:/config/application-prod.properties:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/config/
      JAVA_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 700m

  view:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/hypblog-view:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    mem_limit: 128m

  cms:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/hypblog-cms:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18079:80"
    mem_limit: 128m
