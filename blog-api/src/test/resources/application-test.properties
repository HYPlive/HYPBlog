server.port=0
blog.name=HYPBlog Test
blog.api=http://localhost
blog.cms=http://localhost/admin
blog.view=http://localhost

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/hypblog?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=test-password
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=10000ms

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
token.expireTime=259200000
token.secretKey=test-only-secret-key
comment.notify.channel=mail
comment.default-open=true

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false

upload.channel=local
upload.file.path=target/upload/
upload.file.access-path=/image/**
upload.file.resources-locations=file:${upload.file.path}
tg.bot.api=https://api.telegram.org/bot
tg.bot.token=test-token
tg.bot.chat-id=test-chat
tg.bot.use-proxy=false
tg.bot.use-reverse-proxy=false
tg.bot.reverse-proxy-url=http://localhost
